# Gitea Actions CI: tests on every push/PR.
#
# Prerequisites: an act_runner registered with the instance (labels must
# include `ubuntu-latest` or be adjusted below) and network access for the
# checkout/setup actions and the paperless-chandra git dependency.
# Requires the `[chandra,db]` extras: the test suite imports the plugin.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[chandra,db,dev]"

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Lint
        run: python -m ruff check .
