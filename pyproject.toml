[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-rearchive"
version = "0.1.0"
description = "Tag-driven re-OCR sidecar for paperless-ngx with LLM vision OCR and archive regeneration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["paperless", "paperless-ngx", "ocr", "ocrmypdf", "llm"]
dependencies = [
    "requests>=2.32",
    "pillow>=10",
    "ocrmypdf>=17.4",
]

[project.optional-dependencies]
chandra = [
    "paperless-chandra @ git+https://github.com/flobernd/paperless-chandra.git@v0.1.0",
]
db = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[project.scripts]
paperless-rearchive = "paperless_rearchive.poller:main"

[tool.setuptools.packages.find]
include = ["paperless_rearchive*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
