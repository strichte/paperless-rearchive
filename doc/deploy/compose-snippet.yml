# Add to paperless-lxc/docker-compose.yml (services:) and set the secrets
# shown at the bottom if not already present.
#
# Secret convention: every credential (API token, Chandra API key, DB user
# and password) can be set as a plain value (<VAR>) in `environment:` or an
# env_file, OR via a mounted secret file (<VAR>_FILE) — paperless-ngx style.
# The *_FILE variant wins when both are set. This snippet uses *_FILE for
# ALL credentials, including the API token (add the paperless_api_token
# secret next to the others in the top-level `secrets:` section).

  paperless-rearchive:
    # Built from the checked-out source. The version-pinned image tag makes
    # rollback to a previous release a re-tag + `up -d` away. Pin
    # CHANDRA_REF (a paperless-chandra SHA) for reproducible release builds;
    # UID/GID create the image's rearchive user — same pair as the runtime
    # `user:` (must match paperless's USERMAP_UID/GID).
    build:
      context: ../paperless-rearchive
      dockerfile: docker/Dockerfile
      args:
        CHANDRA_REF: master
        UID: "1001"
        GID: "1001"
    image: paperless-rearchive:v0.1.0
    container_name: paperless-rearchive
    restart: unless-stopped
    user: "1001:1001"
    networks:
      - backend
    environment:
      PAPERLESS_BASE_URL: "http://paperless:8000"
      PAPERLESS_API_TOKEN_FILE: /run/secrets/paperless_api_token
      REARCHIVE_ARCHIVE_DIR: "/archives"
      # Required: keep `.bak-<ts>` archive backups OUTSIDE the media directory
      # so paperless's health check does not report them as orphaned files.
      # Must be a different directory than REARCHIVE_ARCHIVE_DIR - ideally a
      # separate bind mount (it may be another disk; backups are copied).
      # The sidecar refuses to start without it.
      REARCHIVE_BACKUP_DIRECTORY: "/archive-backups"
      PAPERLESS_CHANDRA_SERVER_URL: "http://ai:8110/v1"
      PAPERLESS_CHANDRA_MODEL_NAME: "chandra-ocr-2-q8"
      PAPERLESS_CHANDRA_CONTENT_FORMAT: "markdown"
      PAPERLESS_CHANDRA_API_KEY_FILE: /run/secrets/chandra_api_key
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS_FILE: /run/secrets/paperless_db_paperless_passwd
      REARCHIVE_POLL_INTERVAL: "300"
      REARCHIVE_BATCH_LIMIT: "5"
      # Page-level threads against the same local GPU server. 1 = sequential
      # (default). >1 only piles competing requests onto the same GPU - it
      # does not create more GPU. Raise gradually (2, then 4) and watch GPU
      # utilisation, latency and error rate.
      REARCHIVE_OCR_CONCURRENCY: "1"
      # 0 = OCR all pages, otherwise only the first N pages per document.
      REARCHIVE_MAX_PAGES: "0"
      # Provenance: custom fields (latest state) + append-only audit note per run.
      REARCHIVE_WRITE_PROVENANCE: "true"
      REARCHIVE_DRY_RUN: "false"
    volumes:
      # Read-write: archive files are replaced here (originals are NEVER touched).
      - /data/paperless/media/documents/archive:/archives
      # Required: backup bind mount for REARCHIVE_BACKUP_DIRECTORY. Must NOT be
      # inside /archives (the sidecar refuses to run; paperless would report
      # the backups as orphaned files). May be a different disk than the
      # archive mount.
      - /data/paperless/archive-backups:/archive-backups
    secrets:
      - paperless_api_token
      - chandra_api_key
      - paperless_db_paperless_passwd
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    depends_on:
      - paperless

# Secrets (already defined in the top-level `secrets:` section):
#   paperless_api_token:
#     file: ./secrets/paperless_api_token
#   chandra_api_key:
#     file: ./secrets/chandra_api_key
#   paperless_db_paperless_passwd:
#     file: ./secrets/paperless_db_paperless_passwd
